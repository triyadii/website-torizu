<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="torizuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#c90e3f"/>
    </linearGradient>
  </defs>
  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#torizuBg)"/>
  <!-- Subtle Inner Highlight -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.2"/>
  <!-- Accent dot top right -->
  <circle cx="50" cy="14" r="3" fill="#ffffff" fill-opacity="0.95"/>
  <!-- Kanji '鳥' (TORIZU) -->
  <text x="32" y="44" font-family="'Noto Sans JP', 'Hiragino Sans', 'Meiryo', 'Apple Color Emoji', sans-serif" font-weight="900" font-size="33" fill="#ffffff" text-anchor="middle" dominant-baseline="central">鳥</text>
</svg>
